server:
  port: 8084

spring:
  application:
    name: request-routing-service

  datasource:
    url: jdbc:postgresql://localhost:5432/request_system
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_routing
    baseline-on-migrate: true
    baseline-version: 0

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: request-routing-service-group
      properties:
        spring.json.type.mapping: "com.example.request_service.messaging.event.EventDto:com.example.request_routing_service.messaging.event.EventDto"
        spring.json.trusted.packages: "com.example.request_service.messaging.event"
    listener:
      ack-mode: manual

app:
  strategies-weights:
    weighted:
      load-weight: 0.5
      performance-weight: 0.3
      sla-pressure-weight: 0.2
      weight-sum: 1.0
      eps: 0.001

logging:
  level:
    root: info
    com.example: debug
    org.springframework: warn

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"