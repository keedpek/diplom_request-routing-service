server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/request_system
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_routing
    baseline-on-migrate: true
    baseline-version: 0

app:
  strategies-weights:
    weighted:
      load-weight: 0.5
      performance-weight: 0.3
      sla-pressure-weight: 0.2