server:
  port: 8084

spring:
  application:
    name: request-routing-service

  datasource:
    url: jdbc:postgresql://localhost:5432/request_system
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_routing
    baseline-on-migrate: true
    baseline-version: 0

app:
  strategies-weights:
    weighted:
      load-weight: 0.5
      performance-weight: 0.3
      sla-pressure-weight: 0.2
      weight-sum: 1.0
      eps: 0.001